                        <h5 class="card-title fw-semibold mb-4">My Transactions</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Date</th>
                                        <th>Student</th>
                                        <th>Course</th>
                                        <th>Type</th>
                                        <th>Full Amount</th>
                                        <th>My Revenue</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-table-body">

                                </tbody>
                            </table>
                        </div>

    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/sidebarmenu.js"></script>
    <script src="../assets/js/app.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>
        $(document).ready(function() {
            // Fetch and display transactions
            $.ajax({
                url: '../backend/teacher/get_transactions.php',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.status === 0) {
                        let transactionsHtml = '';
                        response.transactions.forEach(function(tx) {
                            transactionsHtml += `
                                <tr>
                                    <td>${tx.id}</td>
                                    <td>${new Date(tx.timestamp).toLocaleDateString()}</td>
                                    <td>${tx.student_name}</td>
                                    <td>${tx.course_title}</td>
                                    <td>${tx.transaction_type}</td>
                                    <td>$${parseFloat(tx.amount).toFixed(2)}</td>
                                    <td>$${parseFloat(tx.teacher_revenue).toFixed(2)}</td>
                                </tr>
                            `;
                        });
                        $('#transactions-table-body').html(transactionsHtml);
                    } else {
                        swal('Error', response.message, 'error');
                    }
                },
                error: function() {
                    swal('Error', 'Failed to fetch transactions. Please try again.', 'error');
                }
            });

            // Logout functionality
            $('#logout').on('click', function() {
                // Clear session or token
                sessionStorage.removeItem('user');
                // Redirect to login page
                window.location.href = '../authentication-login.html';
            });
        });
    </script>
